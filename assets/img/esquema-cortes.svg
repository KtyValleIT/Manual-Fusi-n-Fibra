<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="800" height="560" fill="#ffffff"/>
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Esquema: cara de la fibra después del cleaving</text>
  <text x="400" y="54" text-anchor="middle" font-size="13" fill="#555">Vista lateral. Esquema ilustrativo, no es una foto de la práctica.</text>

  <!-- Panel 1: buen corte -->
  <text x="40" y="95" font-size="16" font-weight="bold" fill="#1a7f37">1. Buen corte (cara plana, cerca de 90°)</text>
  <rect x="60" y="115" width="500" height="64" fill="#cfe3f5" stroke="#2b5d8a" stroke-width="2"/>
  <rect x="60" y="141" width="500" height="12" fill="#f4b942" stroke="#b07a10" stroke-width="1"/>
  <line x1="560" y1="100" x2="560" y2="195" stroke="#1a7f37" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="590" y="152" font-size="14" fill="#222">Cara perpendicular al eje</text>
  <text x="590" y="172" font-size="14" fill="#1a7f37">Fusión con pérdida baja</text>

  <!-- Panel 2: corte en ángulo -->
  <text x="40" y="250" font-size="16" font-weight="bold" fill="#b42318">2. Corte en ángulo</text>
  <polygon points="60,270 540,270 580,334 60,334" fill="#cfe3f5" stroke="#2b5d8a" stroke-width="2"/>
  <rect x="60" y="296" width="500" height="12" fill="#f4b942" stroke="#b07a10" stroke-width="1"/>
  <line x1="540" y1="255" x2="540" y2="350" stroke="#777" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="600" y="296" font-size="14" fill="#222">Cara inclinada respecto</text>
  <text x="600" y="314" font-size="14" fill="#222">a la perpendicular</text>
  <text x="600" y="336" font-size="14" fill="#b42318">Pérdida alta, repetir corte</text>

  <!-- Panel 3: corte con astilla -->
  <text x="40" y="405" font-size="16" font-weight="bold" fill="#b42318">3. Corte con astilla o borde irregular</text>
  <polygon points="60,425 540,425 552,433 538,441 556,449 540,457 554,466 540,474 560,482 60,482" fill="#cfe3f5" stroke="#2b5d8a" stroke-width="2"/>
  <rect x="60" y="448" width="490" height="12" fill="#f4b942" stroke="#b07a10" stroke-width="1"/>
  <text x="600" y="452" font-size="14" fill="#222">Borde con rebabas</text>
  <text x="600" y="474" font-size="14" fill="#b42318">Burbujas y pérdida alta</text>

  <!-- Leyenda -->
  <rect x="60" y="520" width="16" height="12" fill="#f4b942" stroke="#b07a10"/>
  <text x="84" y="531" font-size="13" fill="#222">Núcleo</text>
  <rect x="160" y="520" width="16" height="12" fill="#cfe3f5" stroke="#2b5d8a"/>
  <text x="184" y="531" font-size="13" fill="#222">Cladding (125 µm)</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
