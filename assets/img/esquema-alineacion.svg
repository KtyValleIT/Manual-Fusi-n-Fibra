<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="800" height="420" fill="#ffffff"/>
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Esquema: alineación de núcleo y cladding</text>
  <text x="400" y="54" text-anchor="middle" font-size="13" fill="#555">Vista lateral. Esquema ilustrativo, no es una foto de la práctica.</text>

  <!-- Alineado -->
  <text x="40" y="95" font-size="16" font-weight="bold" fill="#1a7f37">1. Núcleos alineados</text>
  <rect x="60" y="115" width="320" height="64" fill="#cfe3f5" stroke="#2b5d8a" stroke-width="2"/>
  <rect x="60" y="141" width="320" height="12" fill="#f4b942" stroke="#b07a10"/>
  <rect x="420" y="115" width="320" height="64" fill="#cfe3f5" stroke="#2b5d8a" stroke-width="2"/>
  <rect x="420" y="141" width="320" height="12" fill="#f4b942" stroke="#b07a10"/>
  <path d="M 390 100 L 400 118 L 410 100" fill="none" stroke="#c2410c" stroke-width="2"/>
  <text x="400" y="92" text-anchor="middle" font-size="12" fill="#c2410c">arco eléctrico</text>
  <text x="400" y="205" text-anchor="middle" font-size="14" fill="#1a7f37">La luz pasa de un núcleo al otro, pérdida baja</text>

  <!-- Desalineado -->
  <text x="40" y="250" font-size="16" font-weight="bold" fill="#b42318">2. Núcleos desalineados</text>
  <rect x="60" y="270" width="320" height="64" fill="#cfe3f5" stroke="#2b5d8a" stroke-width="2"/>
  <rect x="60" y="296" width="320" height="12" fill="#f4b942" stroke="#b07a10"/>
  <rect x="420" y="270" width="320" height="64" fill="#cfe3f5" stroke="#2b5d8a" stroke-width="2"/>
  <rect x="420" y="311" width="320" height="12" fill="#f4b942" stroke="#b07a10"/>
  <text x="400" y="360" text-anchor="middle" font-size="14" fill="#b42318">Parte de la luz se pierde en el cladding, pérdida alta</text>

  <!-- Leyenda -->
  <rect x="60" y="388" width="16" height="12" fill="#f4b942" stroke="#b07a10"/>
  <text x="84" y="399" font-size="13" fill="#222">Núcleo</text>
  <rect x="160" y="388" width="16" height="12" fill="#cfe3f5" stroke="#2b5d8a"/>
  <text x="184" y="399" font-size="13" fill="#222">Cladding (125 µm)</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
